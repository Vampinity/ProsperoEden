name: Game tiles publish

# Publishes a finished "Game tiles build" run's ZIP as a pre-release, so it can be downloaded
# without signing in to GitHub.
# Pushing a branch named publish-<run ID> publishes that run.
on:
  push:
    branches: ['publish-*']

permissions:
  contents: write
  actions: read

env:
  RUN_ID: ${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "RUN_ID=${RUN_ID#publish-}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: ProsperoEden-game-tiles
          path: dist
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          tag="game-tiles-${{ env.RUN_ID }}"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ env.RUN_ID }}" -q .head_sha)
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$sha" --prerelease \
            --title "ProsperoEden with game tiles and button swap ($tag)" \
            --notes "Built from $sha by run ${{ env.RUN_ID }}." dist/*.zip dist/SHA256SUMS
