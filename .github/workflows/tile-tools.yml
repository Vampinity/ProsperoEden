name: Tile tools

# Builds the game tile starter, the tile launcher and make-tiles.py (tools/game-tiles/starter/build.sh)
# without the emulator, a few minutes instead of the full build. On the game-tiles branch the result
# is published as pre-release tile-tools-<run ID>, so a Mac can download it without signing in.
on:
  push:
    paths:
      - tools/game-tiles/**
      - .github/workflows/tile-tools.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18 make ninja-build wget unzip zip

      - name: Build
        run: |
          bash tools/game-tiles/starter/build.sh
          (cd dist && sha256sum tile-starter.zip > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: tile-tools
          path: |
            dist/tile-starter.zip
            dist/SHA256SUMS
          retention-days: 14

      - name: Pre-release
        if: github.ref == 'refs/heads/game-tiles'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="tile-tools-${{ github.run_id }}"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Game tile tools ($tag)" \
            --notes "Tile starter, tile launcher and make-tiles.py, built from $GITHUB_SHA by run ${{ github.run_id }}." \
            dist/tile-starter.zip dist/SHA256SUMS
