name: Game tiles build

# Builds the release ZIP (make release; docs/BUILDING.md) on a GitHub-hosted runner, for this
# fork's game tiles and button swap changes. The ZIP is kept as a 14-day artifact.
on:
  push:
    branches: [game-tiles]
  workflow_dispatch:

concurrency:
  group: game-tiles-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18 cmake ninja-build ccache make nasm \
            rsync git glslang-tools spirv-tools bison flex curl wget unzip tar python3-venv \
            python3-mako python3-yaml pkg-config autoconf automake libtool \
            llvm-18-dev libclang-18-dev libclang-cpp18-dev libpolly-18-dev libllvmspirvlib-18-dev \
            libclc-18-dev libclc-18 python3-packaging python3-ply
          sudo pip3 install --break-system-packages 'meson>=1.4'
          bash tools/check-toolchain.sh

      - name: Build and package
        env:
          JOBS: 4
        run: bash tools/ci/build-release.sh

      - name: Tile starter
        # The small app make-tiles.py installs as each game's tile (dist/tile-starter.zip).
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq zip
          bash tools/game-tiles/starter/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ProsperoEden-game-tiles
          path: dist/
          retention-days: 14

      - name: Logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/*.log
            ~/.cache/ps5-eden-headless.*/**/CMakeFiles/CMakeError.log
            ~/.cache/ps5-eden-headless.*/**/meson-logs/*.txt
          if-no-files-found: ignore
